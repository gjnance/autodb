version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql+asyncpg://autodb:autodb@db:5432/autodb
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy
    network_mode: service:db

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=autodb
      - POSTGRES_PASSWORD=autodb
      - POSTGRES_DB=autodb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
